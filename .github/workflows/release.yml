name: Release

on:
  push:
    # `main` ships stable releases to the `latest` dist-tag.
    # `release/next` ships pre-releases — it carries `.changeset/pre.json`
    # (changesets pre mode, tag `next`), so `changeset publish` auto-routes
    # those versions (e.g. 6.0.0-next.0) to the `next` dist-tag instead of
    # `latest`. Stable 5.x patches can keep flowing from `main` independently.
    branches: [main, release/next]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write # required for npm provenance

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The changesets action handles both phases:
      # - When changesets exist: opens/updates the "Version Packages" PR
      #   (running `changeset version`). On `release/next` (pre mode) this yields
      #   `X.Y.Z-next.N`; on `main` it yields normal versions.
      # - When the version PR is merged (no changesets remain): runs the `publish`
      #   command. `changeset publish` auto-routes the npm dist-tag — pre-release
      #   versions go to the pre tag (`next`), stable versions go to `latest` —
      #   and pushes the matching git tags. `prepublishOnly` runs the lint/
      #   typecheck/test/build gate on the underlying `npm publish`.
      - name: Version or Publish
        uses: changesets/action@v1
        with:
          version: bun run changeset:version
          publish: bun run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
